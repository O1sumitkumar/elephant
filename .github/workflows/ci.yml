name: CI and releases

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CGO_ENABLED: '1'
  ZOVA_VERSION: v1.3.0
  ZOVA_COMMIT: a30581ef7070ebc335fed06bbc46ea94a8326c5f

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and test (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            goos: linux
            goarch: arm64
            zig-target: aarch64-linux-gnu
            binary: elephant
          - runner: ubuntu-24.04
            target: linux-amd64
            goos: linux
            goarch: amd64
            zig-target: x86_64-linux-gnu
            binary: elephant
          - runner: windows-2022
            target: windows-amd64
            goos: windows
            goarch: amd64
            zig-target: x86_64-windows-gnu
            binary: elephant.exe
          - runner: macos-15
            target: macos-arm64
            goos: darwin
            goarch: arm64
            zig-target: aarch64-macos.14.0
            binary: elephant
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0
      - name: Verify target, dependencies, and release tag
        env:
          EXPECTED_GOOS: ${{ matrix.goos }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
        run: |
          test "$(go env GOOS)" = "$EXPECTED_GOOS"
          test "$(go env GOARCH)" = "$EXPECTED_GOARCH"
          test "$(go list -m -f '{{.Version}}' github.com/ata-sesli/zova/bindings/go)" = "$ZOVA_VERSION"
          go mod download
          go mod verify
          version="dev-${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$(python scripts/release.py version "$GITHUB_REF_NAME")"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Check formatting and packaging tests
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [[ -n "$unformatted" ]]; then
            echo "$unformatted"
            exit 1
          fi
          python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check out matching Zova source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ata-sesli/zova
          ref: ${{ env.ZOVA_COMMIT }}
          path: .deps/zova
          persist-credentials: false
      - name: Include Zig runtime for external CGO linkers
        run: python scripts/prepare_zova.py .deps/zova/build.zig
      - name: Build Zova C ABI
        working-directory: .deps/zova
        env:
          ZIG_TARGET: ${{ matrix.zig-target }}
        run: |
          zig build c-abi -Doptimize=ReleaseSafe -Dtarget="$ZIG_TARGET"
          if [[ "$RUNNER_OS" == macOS ]]; then
            sh scripts/repack-darwin-c-abi.sh
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            root="$(pwd -W)"
            echo 'CC=gcc' >> "$GITHUB_ENV"
            gcc --version
          else
            root="$PWD"
          fi
          echo "CGO_CFLAGS=-I$root/include" >> "$GITHUB_ENV"
          ldflags="-L$root/zig-out/lib"
          if [[ "$RUNNER_OS" == Windows ]]; then
            # Zova's Zig runtime calls NT APIs; MinGW does not link NTDLL by default.
            ldflags="$ldflags -lntdll"
          fi
          echo "CGO_LDFLAGS=$ldflags" >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == macOS ]]; then
            echo 'MACOSX_DEPLOYMENT_TARGET=14.0' >> "$GITHUB_ENV"
          fi
      - name: Test including real MCP stdio processes
        run: go test -v -timeout 5m ./...
      - name: Check for data races
        run: go test -race -timeout 5m ./...
      - name: Vet
        run: go vet ./...
      - name: Build and smoke-test release executable
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          go build -trimpath -ldflags "-s -w -X elephant/internal/transport/mcp.Version=$VERSION" -o "bin/$BINARY" ./cmd/elephant
          test "$("./bin/$BINARY" --version)" = "elephant $VERSION"
      - name: Package tagged release
        if: github.ref_type == 'tag'
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          go mod vendor -o .deps/notices
          cp "$(go env GOROOT)/LICENSE" .deps/notices/Go-LICENSE
          cp .deps/zova/LICENSE .deps/notices/Zova-LICENSE
          python scripts/release.py package "$GITHUB_REF_NAME" "$TARGET" "bin/$BINARY"
      - name: Upload release archive
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: elephant-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: elephant-*
          path: dist
          merge-multiple: true
      - name: Check all four archives and generate checksums
        run: python scripts/release.py checksums "$GITHUB_REF_NAME" dist
      - name: Publish only after every asset is uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            test "$draft" = true || { echo 'Release already published; refusing to replace assets.'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "$RELEASE_TAG" "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
